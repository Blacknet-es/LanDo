services:
  # ── PostgreSQL with pgvector ───────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: lando_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lando}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lando_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lando_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5435 avoids conflicts with other local Postgres instances
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lando} -d ${POSTGRES_DB:-lando_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI / LangGraph API ────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: lando_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lando}:${POSTGRES_PASSWORD:-lando_secret}@db:5432/${POSTGRES_DB:-lando_db}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      # Host port 8001 avoids conflicts with other local services on 8000
      - "${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    # Ollama runs on the host — extra_hosts makes host.docker.internal resolve
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:

networks:
  default:
    name: lando_network
