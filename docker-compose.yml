version: '3.8'

services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=sqlite:///./sql_app.db
      - WEBHOOK_SECRET=your_secret_here

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=lan_do
      - POSTGRES_USER=lan_do
      - POSTGRES_PASSWORD=lan_do
    volumes:
      - db_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    networks:
      - lando_network
    volumes:
      - lando_n8n_data:/home/node/.n8n
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Europe/Madrid
      - WEBHOOK_SECRET=your_secret_here

networks:
  lando_network:
    driver: bridge

volumes:
  db_data:
  lando_n8n_data:
